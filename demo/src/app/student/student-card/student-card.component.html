<article>
    <h4>{{student.name}}
        <button (click)="isGradeVisible = !isGradeVisible">
            @if (isGradeVisible) {
                Masquer moyenne
            } @else {
                Afficher moyenne
            }
        </button>
    </h4>

    @if (isGradeVisible) {
        <p>{{student.grade}}/20</p>
    }
  <button (click)="deleteStudent()">Delete Student</button>
</article>
