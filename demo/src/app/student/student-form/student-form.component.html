<div>
  <form action="">
    <p>
      <input name="name" [(ngModel)]="student.name" type="text" placeholder="nom" />
    </p>
    <p>
      <input name="grade" [(ngModel)]="student.grade" type="number" max="20" min="0" placeholder="grade" />
    </p>
    <p>
      <button (click)="addStudent()">Ajouter</button>
    </p>
  </form>

  <p>{{student | json}}</p>

  @if (message) {
    <p>{{message}}</p>
  }

</div>
